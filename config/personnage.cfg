; Déplacement du personnage. Les vitesses sont en mètres par seconde.

[deplacement]

; Vitesse quand le joystick est poussé à moitié.
vitesse_marche=1.8
; Vitesse quand le joystick est poussé à fond.
vitesse_course=4.5
; Vitesse à laquelle le personnage atteint sa vitesse ou s'arrête
; (plus grand = plus nerveux, plus petit = plus glissant).
acceleration=18.0
; Vitesse à laquelle le personnage se tourne vers sa direction (plus grand = plus vif).
lissage_rotation=12.0

[animation]

; Vitesse de déplacement pour laquelle les animations de marche et de course
; sont jouées à vitesse normale. Si les pieds « glissent » sur le sol,
; ajuster ces valeurs jusqu'à ce que les pas collent au déplacement.
vitesse_reference_marche=1.8
vitesse_reference_course=4.5
; Durée du fondu entre deux animations, en secondes.
fondu=0.2

[apparence]

; Apparence du personnage, indépendante de l'équipement (scripts/game/apparence.gd).
; Chaque liste a une version homme et une version femme ; "" = aucune.
; La coiffure est cachée sous un casque ; la barbe et les sourcils restent visibles.
; Le premier choix de chaque liste est celui d'un nouveau personnage.
coiffures_homme=["cosmetic.cheveux_courts", "cosmetic.cheveux_longs", "cosmetic.cheveux_rases", ""]
coiffures_femme=["cosmetic.cheveux_longs", "cosmetic.chignon", "cosmetic.cheveux_rases_femme", "cosmetic.cheveux_courts"]
barbes_homme=["cosmetic.barbe", ""]
barbes_femme=[""]
sourcils_homme=["cosmetic.sourcils"]
sourcils_femme=["cosmetic.sourcils_femme"]
; Couleurs des cheveux, de la barbe et des sourcils : brun, noir, châtain clair, roux, blond, gris.
couleurs_cheveux_homme=[Color(0.42, 0.28, 0.18, 1), Color(0.13, 0.11, 0.1, 1), Color(0.62, 0.45, 0.3, 1), Color(0.68, 0.3, 0.14, 1), Color(0.95, 0.8, 0.5, 1), Color(0.72, 0.72, 0.72, 1)]
couleurs_cheveux_femme=[Color(0.42, 0.28, 0.18, 1), Color(0.13, 0.11, 0.1, 1), Color(0.62, 0.45, 0.3, 1), Color(0.68, 0.3, 0.14, 1), Color(0.95, 0.8, 0.5, 1), Color(0.72, 0.72, 0.72, 1)]

