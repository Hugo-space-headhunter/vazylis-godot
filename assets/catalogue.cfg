[weapon.epee_depart]

; Polyy, 3D Fantasy Weapons Pack (low), « Knight's Longsword ». Arme de départ provisoire.
; rotation_degres et decalage placent la poignée dans la main (point d'attache « main_droite ») ;
; « placements » donne la position sur d'autres points d'attache (ici, rangée dans le dos).
fichier="res://assets/models/weapon/epee_depart/epee_depart.glb"
echelle=1.0
rotation_degres=Vector3(-75.7, -171.2, -99.3)
decalage=Vector3(-0.008, 0.148, 0.366)
placements={"dos": {"rotation_degres": Vector3(18.8, 94.5, 103.7), "decalage": Vector3(0, 0, -0.2)}}
animations={}
points_attache={}
forme_repli="boite"
taille_repli=Vector3(0.05, 0.9, 0.05)
couleur_repli=Color(0.8, 0.8, 0.85, 1)

