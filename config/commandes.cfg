; Commandes tactiles et caméra.
; Les tailles en pixels sont données pour un écran de référence de 720 pixels
; (le jeu les adapte automatiquement à la taille réelle de l'écran).

[joystick]

; Rayon du joystick flottant, en pixels.
rayon=110.0
; En dessous de cette poussée (0 à 1), le joystick ne fait rien (évite les petits tremblements).
zone_morte=0.15
; Au-delà de cette poussée (0 à 1), le personnage court au lieu de marcher.
seuil_course=0.65

[camera]

; Distance entre la caméra et le personnage, en mètres (paysage).
distance=4.6
; En portrait, l'écran est étroit : la caméra recule un peu pour garder les monstres en vue.
distance_portrait=5.4
; Angle de vue vers le bas, en degrés (0 = à l'horizontale, 90 = vue du dessus).
inclinaison_degres=34.0
inclinaison_portrait_degres=38.0
; Hauteur du point regardé au-dessus des pieds du personnage, en mètres.
hauteur_visee=1.25
; Champ de vision, en degrés : en paysage, l'angle vertical ; en portrait, l'angle horizontal
; (la largeur de l'écran limite ce qu'on voit sur les côtés).
champ_vision=48.0
champ_vision_portrait=46.0
; La caméra regarde un peu devant le personnage quand il avance (secondes de déplacement
; anticipées), pour mieux voir où il va.
avance_regard=0.35
; Murs, maisons et gros rochers : la caméra se rapproche au lieu de passer derrière.
; Distance minimale au personnage dans ce cas, en mètres.
distance_minimale=2.0
; Rapidité avec laquelle la caméra rattrape le personnage (plus grand = plus collé).
lissage_suivi=8.0
; Rotation de la caméra, en degrés par pixel glissé avec le deuxième doigt.
sensibilite_rotation=0.35

[afk]

; Mode AFK : le personnage va chercher seul les monstres dans ce rayon autour de l'endroit
; où le mode a été activé (en mètres), sans jamais attaquer un sous-boss de lui-même.
rayon=14.0
; Poussée simulée du joystick pendant les trajets (0 à 1 ; au-dessus de seuil_course, il court).
poussee=1.0
; Il s'arrête à cette part de la portée de son arme avant de frapper (0 à 1).
part_de_la_portee=0.8
