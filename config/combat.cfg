; Combat (docs/game-design.md, sections « Formules de combat » et « Calibrage des monstres »).

[joueur]

; Points de vie = base + par_niveau × niveau (les points de Vitalité arriveront à l'étape 3).
pv_base=100.0
pv_par_niveau=15.0
; Distance à laquelle le personnage frappe un monstre, en mètres.
portee_attaque=1.6
; Après une mort : secondes avant de revenir au point de départ (provisoire, la vraie mort arrive à l'étape 6).
delai_reapparition=3.0

[arme_depart]

; Arme de départ provisoire, épée et bouclier standard, dont le niveau suit celui du joueur
; jusqu'à l'arrivée du butin (étape 4).
rarete="standard"
; Dégâts de l'arme = (degats_base + degats_par_niveau × niveau) × multiplicateur de rareté.
degats_base=10.0
degats_par_niveau=3.0
; Coups par seconde.
vitesse=1.1

[critique]

; Chance de base de coup critique (0 à 1) et multiplicateur de dégâts.
chance=0.05
multiplicateur=1.5

[calibrage]

; Temps visé pour tuer un monstre de son niveau, et pour qu'il tue le joueur sans soin (secondes).
secondes_pour_tuer_un_monstre=10.0
secondes_pour_etre_tue=60.0
; Les monstres passifs frappent moins fort (0.5 = deux fois moins).
multiplicateur_passifs=0.5
; Un monstre plus haut que le joueur de plus de « ecart_sans_bonus » niveaux
; frappe « bonus_par_niveau » plus fort par niveau d'écart au-delà.
ecart_sans_bonus=5
bonus_par_niveau=0.05
