; Objets qui peuvent tomber des monstres (docs/game-design.md, « Les objets de la zone 1 »).
;
; Chaque famille d'objet a sa section :
;   nom          : nom affiché
;   zone         : zone dont l'objet est le style (1 = la Vallée claire)
;   emplacement  : "arme", "casque", "plastron", "gants", "bottes", "ceinture", "cape",
;                  "collier" ou "boucle_oreille"
;   type_arme    : pour une arme, son type (section de armes.cfg)
;   modele_main_droite / modele_main_gauche : pour une arme, ses modèles (assets/catalogue.cfg)
;   modele_homme / modele_femme : pour une armure ou un bijou, ses modèles
;   style        : tenue de l'objet ("paysan", "rodeur"…), pour l'équipement visible
;
; La section [generation] règle ce que donne un objet.

[generation]

; Chaque valeur est tirée entre qualite_min et qualite_max de son maximum.
qualite_min=0.7
qualite_max=1.0
; Armure = puissance × part de l'emplacement.
part_armure={"plastron": 1.0, "casque": 0.6, "bottes": 0.5, "gants": 0.4, "ceinture": 0.4, "cape": 0.3}
; Statistiques données : nombre minimum et maximum, et valeur maximum par point de puissance.
nombre_statistiques=[1, 2]
statistiques_par_puissance=0.3
; Les bijoux : pas d'armure, mais plus de statistiques.
nombre_statistiques_bijoux=[2, 3]
statistiques_par_puissance_bijoux=0.5
; Bonus en % (valeur maximum, 0.03 = 3 %). Leur nombre dépend de la rareté (raretes.cfg).
bonus_maximum={"vitesse_attaque": 0.05, "chance_critique": 0.03, "degats_critiques": 0.1, "vie": 0.04, "degats": 0.04}

[objet.dagues_braconnier]

nom="Dagues de braconnier"
zone=1
emplacement="arme"
type_arme="arme.dagues"
modele_main_droite="weapon.dague"
modele_main_gauche="weapon.dague"

