; Statistiques du personnage (docs/game-design.md, section « Effet précis de chaque point »).

[points]

; Points à répartir gagnés à chaque niveau (aucun au niveau 1).
par_niveau=4

[force]

; Dégâts ajoutés à chaque coup par point de Force.
degats_par_point=2.0

[agilite]

; Vitesse d'attaque gagnée par point (0.004 = +0,4 %).
vitesse_par_point=0.004
; Chance de coup critique gagnée par point (0.001 = +0,1 %).
critique_par_point=0.001

[vitalite]

; Points de vie et défense gagnés par point de Vitalité.
pv_par_point=12.0
defense_par_point=0.5

[intelligence]

; Mana gagné par point d'Intelligence (le mana sert plus tard, pour la magie).
mana_par_point=5.0

[affinite]

; Bonus de dégâts par point de la statistique d'affinité de l'arme (0.003 = +0,3 %).
bonus_par_point=0.003

[plafonds]

; Vitesse d'attaque au plus multipliée par ce nombre.
vitesse_max=2.5
; Chance de coup critique maximum (0.6 = 60 %).
critique_max=0.6
; Réduction des dégâts subis maximum (0.75 = 75 %).
reduction_max=0.75

[defense]

; Réduction des dégâts subis = défense ÷ (défense + facteur × niveau de l'attaquant).
facteur_niveau_attaquant=50.0
