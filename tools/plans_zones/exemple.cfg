; Plan d'exemple pour tools/peupler_zone.gd : les monstres et le décor d'une zone.
; Positions en mètres dans le repère de la zone : x vers l'est, z vers le sud ; (0, 0) = centre de la zone.
; Valeurs d'équilibrage (niveaux, vie…) : elles restent dans config/, pas ici.

[zone]

; Graine du hasard : la même graine redonne exactement la même zone.
graine=1
; Places à laisser libres : [x, z, rayon] (une clairière, l'entrée d'un donjon…).
places_libres=[[0, 0, 6]]
; Chemin droit nord-sud : centre en x et demi-largeur (laissé libre de décor).
chemin={"x": 0.0, "demi_largeur": 3.0}

; Un groupe de monstres par section « monstres.<Nom> ».
[monstres.Cochonnets]

monstre="monstre.cochonnet_suie"
nombre=4
rayon=4.0
position=Vector2(-12, 8)

; Un groupe de décor par section « decor.<Nom> » : posés au hasard, sans se chevaucher.
[decor.Arbre]

assets=["prop.erable_1", "prop.erable_2", "prop.bouleau_1"]
nombre=12
; Écart minimal entre deux objets (mètres) et marge le long du bord de la zone.
ecart_min=4.0
marge_bord=3.0
; Taille au hasard entre ces deux valeurs.
echelle=[0.85, 1.15]
obstacle=Vector3(0.7, 3, 0.7)
distance_affichage=40.0
fondu_camera=4.0

[decor.Buisson]

assets=["prop.buisson", "prop.buisson_fleuri"]
nombre=10
ecart_min=2.0
echelle=[0.8, 1.2]
distance_affichage=30.0
