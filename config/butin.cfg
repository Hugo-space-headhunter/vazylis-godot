; Butin (docs/game-design.md, « Tables de loot » et « Mécaniques de motivation »).
;
; Chaque ligne est un tirage indépendant : un monstre peut ne rien lâcher,
; ou plusieurs objets d'un coup. Chance de 0 à 1 (0.08 = 8 %).

[monstre]

standard=0.08
argente=0.03
dore=0.005
epique=0.0005
; Ressources : chance d'en lâcher, et nombre d'unités.
ressources=0.35
ressources_min=1
ressources_max=3

[champion]

; Un monstre sur 200 apparaît en version champion (voir combat.cfg).
standard=0.0
argente=1.0
dore=1.0
epique=0.03
ressources=1.0
ressources_min=2
ressources_max=4

[sous_boss]

standard=0.0
argente=1.0
dore=0.3
epique=0.05
ressources=1.0
ressources_min=3
ressources_max=6
; Ressource de familier (Lueur de familier).
familier=0.6
familier_min=1
familier_max=2

[garantie]

; Sans doré depuis ce nombre de monstres, le suivant donne un doré.
dore_apres=250
; Sans épique depuis ce nombre de monstres, le suivant donne un épique.
epique_apres=2000
; Un sous-boss donne un épique au plus tard à cette victoire sans épique.
epique_sous_boss_apres=12

[sac]

; Nombre de cases du sac à dos.
cases=40

[recyclage]

; Or gagné en recyclant un objet = or_par_puissance × puissance de l'objet.
or_par_puissance=2.0
