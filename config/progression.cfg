; Progression du personnage (docs/game-design.md, section « Rythme cible et courbe d'XP »).

[temps_cible]

; Temps de jeu visé pour passer un niveau L, en minutes :
;   t(L) = base_minutes + coefficient × L ^ exposant
; Avec les valeurs ci-dessous : environ 35 secondes au niveau 1, 3,5 min au niveau 20,
; 22 min au niveau 100 et 49 min au niveau 200.
base_minutes=0.5
coefficient=0.084
exposant=1.2

[farm]

; Nombre de monstres tués par minute en farm normal (un toutes les 10 secondes).
; Sert à calculer l'XP requise pour un niveau :
;   XP requise = t(L) × monstres_par_minute × XP de base d'un monstre de ce niveau
monstres_par_minute=6.0

[xp]

; XP de base d'un monstre de niveau L = xp_base_par_niveau × L.
xp_base_par_niveau=10.0
; Monstre plus fort que le joueur : bonus par niveau d'écart, plafonné.
bonus_par_niveau_au_dessus=0.05
bonus_maximum=0.5
; Monstre plus faible que le joueur : malus par niveau d'écart, avec un minimum.
malus_par_niveau_en_dessous=0.1
coefficient_minimum=0.05
