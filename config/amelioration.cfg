; Amélioration des items de +1 à +10 à la forge de Vazylis (docs/game-design.md, sections
; « Taux de réussite de l'amélioration » et « Les 4 familles de matériaux »).
;
; Chaque valeur de [reussite] est la chance de réussir pour atteindre ce palier,
; entre 0 (jamais) et 1 (toujours). Exemple : 0.45 = 45 %.
; Un échec fait perdre les matériaux et l'or payés, jamais le niveau d'amélioration.

[amelioration]

; Palier maximum.
palier_max=10

[reussite]

plus_1=1.0
plus_2=1.0
plus_3=0.9
plus_4=0.8
plus_5=0.7
plus_6=0.45
plus_7=0.35
plus_8=0.2
plus_9=0.12
plus_10=0.06

[gain]

; Ce que chaque palier ajoute aux dégâts, à l'armure et aux statistiques de l'objet
; (décidé à l'étape 7) : 0.05 = +5 % des valeurs de départ. Les gains s'additionnent :
; un objet +10 vaut 1,65 fois sa version de départ. Sa puissance augmente pareil.
plus_1=0.05
plus_2=0.05
plus_3=0.05
plus_4=0.05
plus_5=0.05
plus_6=0.08
plus_7=0.08
plus_8=0.08
plus_9=0.08
plus_10=0.08

[cout]

; Matériaux pour tenter le palier P sur un objet de niveau N :
;   arrondi supérieur de (materiaux_base + P) × (1 + N × materiaux_par_niveau)
; Exemple : passer une arme de niveau 10 en +5 coûte (2 + 5) × (1 + 10 × 0.1) = 14 fer.
materiaux_base=2
materiaux_par_niveau=0.1
; Or : P × or_par_palier × puissance de départ de l'objet.
or_par_palier=1.0

[materiaux]

; Le matériau qui sert à améliorer chaque type d'objet (section de config/ressources.cfg).
; Une arme prend le matériau de son type, ou celui de « arme » si son type n'est pas listé.
par_emplacement={"arme": "ressource.fer", "casque": "ressource.fer", "plastron": "ressource.fer", "gants": "ressource.cuir", "bottes": "ressource.cuir", "ceinture": "ressource.cuir", "cape": "ressource.cuir", "collier": "ressource.fer", "boucle_oreille": "ressource.fer"}
par_type_arme={"arme.arc": "ressource.chene"}
