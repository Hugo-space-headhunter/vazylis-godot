; Catalogue d'assets : le seul endroit qui relie un identifiant du jeu à un fichier 3D.
;
; Pour remplacer un modèle, il suffit de changer « fichier » (et si besoin les
; réglages) dans la section de son identifiant. Le gameplay ne change pas.
;
; Réglages possibles pour chaque identifiant :
;   fichier         : chemin du modèle (.glb ou .gltf), rangé dans
;                     assets/models/<catégorie>/<nom>/
;   echelle         : agrandit (2.0) ou rétrécit (0.5) le modèle
;   rotation_degres : rotation en degrés autour des axes X, Y, Z
;   decalage        : déplacement en mètres sur X, Y, Z (pour poser le modèle au sol ; les héros
;                     sont remontés de 5 cm car leur animation de repos enfonce les orteils dans le sol)
;                     Le jeu considère que l'avant d'un modèle regarde vers +Z
;                     (l'export glTF standard de Blender et de Tripo).
;   bibliotheques_animations : fichiers d'animations partagés, si le modèle n'a pas
;                     les siens (même squelette que le modèle)
;   animations      : vrai nom de chaque animation standard (idle, walk, run,
;                     attack, attack_heavy (coup à deux mains), shoot (tir à l'arc), hit, die ;
;                     pour les héros aussi : guard_shield, guard_sword (gardes), attack_a, attack_b,
;                     bash (coup de bouclier), block (parade)),
;                     par exemple {"idle": "Idle", "walk": "Walk"}
;   points_attache  : nom de l'os pour chaque point d'attache,
;                     par exemple {"main_droite": "hand.R", "tete": "head"}
;   corde           : pour un arc, les bouts de la corde (repère du modèle) et le nom de sa corde fixe,
;                     pour la corde qui se tend pendant le tir (scripts/world/tir_arc.gd)
;   tissu           : pour un objet en tissu qui a des os (cape) : colonnes d'os à faire flotter
;                     {"chaines": [[os du haut, os du bas], …], "raideur", "amorti", "gravite", "rayon"}
;                     (scripts/world/tissu.gd)
;   collisions_tissu: pour un personnage : capsules invisibles qui empêchent le tissu de traverser le corps,
;                     [[os suivi, os de départ, os d'arrivée, rayon], …]
;   pendule         : pour un objet rigide qui se balance (amulette) : {"pivot" (point d'accroche,
;                     repère du modèle), "raideur", "amorti", "sensibilite", "angle_max" (degrés)}
;   poignee_mains   : pour une arme à deux mains, où se posent la main droite et la main gauche
;                     (repère du modèle de l'arme ; calculé par tools/calculer_prise_deux_mains.gd)
;   placements      : pour un objet porté (arme…), position sur chaque point
;                     d'attache autre que celui de rotation_degres/decalage, par exemple
;                     {"dos": {"rotation_degres": Vector3(…), "decalage": Vector3(…)}}.
;                     « main_droite:repos » donne la position en main quand on n'attaque pas.
;                     Les outils tools/calculer_prise.gd et tools/calculer_prise_pose.gd calculent ces valeurs.
;   teinte          : multiplie les couleurs du modèle (blanc = aucune
;                     modification), par exemple pour assombrir une variante
;   couleur_unie    : remplace toutes les couleurs du modèle par une seule (une statue de pierre)
;   texture_matiere : plaque une texture sur toutes les faces du modèle, à la place de ses couleurs :
;                     {"couleur": chemin, "relief": chemin, "echelle": motifs par unité du modèle}
;   teinte_par_matiere : teinte une seule matière par son nom, ex. {"MapleTree_Leaves": Color(…)}
;   forme_repli     : forme du modèle provisoire si le fichier manque
;                     ("boite", "sphere" ou "capsule")
;   taille_repli    : taille de ce modèle provisoire, en mètres
;   couleur_repli   : couleur de ce modèle provisoire (rouge, vert, bleu, opacité, de 0 à 1)

