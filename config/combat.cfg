; Combat (docs/game-design.md, sections « Formules de combat » et « Calibrage des monstres »).

[joueur]

; Points de vie = base + par_niveau × niveau + points de Vitalité (voir statistiques.cfg).
pv_base=100.0
pv_par_niveau=15.0
; Après une mort : secondes avant de revenir au point de départ (provisoire, la vraie mort arrive à l'étape 6).
delai_reapparition=3.0
; Arme portée au départ (famille d'objet de objets.cfg), standard et de niveau 1.
objet_depart="objet.epee_ecu_milicien"

[arme]

; Dégâts de l'arme = (degats_base + degats_par_niveau × niveau de l'arme) × rareté × multiplicateur du type d'arme.
; « rarete » est celle de l'équipement du joueur « moyen » qui sert à régler les monstres.
rarete="standard"
degats_base=10.0
degats_par_niveau=3.0

[critique]

; Chance de base de coup critique (0 à 1). Le multiplicateur de dégâts dépend de l'arme (armes.cfg).
chance=0.05

[calibrage]

; Temps visé pour tuer un monstre de son niveau, et pour qu'il tue le joueur sans soin (secondes).
secondes_pour_tuer_un_monstre=10.0
secondes_pour_etre_tue=60.0
; Le joueur « moyen » qui sert de référence : points mis dans chaque statistique à chaque niveau, et son arme.
points_par_statistique_par_niveau=1
arme_reference="arme.epee_bouclier"
; Les monstres passifs frappent moins fort (0.5 = deux fois moins).
multiplicateur_passifs=0.5

; Un monstre plus haut que le joueur de plus de « ecart_sans_bonus » niveaux
; frappe « bonus_par_niveau » plus fort par niveau d'écart au-delà.
ecart_sans_bonus=5
bonus_par_niveau=0.05

[champion]

; Un monstre sur « un_sur » apparaît en version champion : plus gros, avec une aura,
; plus de vie et d'XP, et il frappe plus fort (environ 50 s pour le tuer, 30 s pour qu'il te tue).
un_sur=200
vie=5.0
xp=5.0
degats=2.0
echelle=1.4

[sous_boss]

; Environ 1 minute pour le tuer, 20 secondes pour qu'il te tue (game design, « Calibrage des monstres »).
secondes_pour_tuer=60.0
secondes_pour_etre_tue=20.0
; XP d'un sous-boss = XP d'un monstre de son niveau × ce nombre.
xp=6.0

[impact]

; Ressenti des coups du joueur qui touchent (scripts/world/joueur.gd, _ressentir_l_impact).
; Secousse de la caméra : amplitude en mètres, selon le coup (normal, arme à deux mains, critique).
secousse_normale=0.02
secousse_lourde=0.07
secousse_critique=0.09
; Durée de la secousse (secondes).
duree_secousse=0.18
; Éclair blanc sur le monstre touché : durée (secondes) et force (0 = rien, 1 = tout blanc).
duree_eclair=0.12
force_eclair=0.55
; Arrêt sur image (le temps ralentit presque à l'arrêt) : durée en secondes (0 = jamais).
arret_lourd=0.06
arret_critique=0.08
; Vitesse du temps pendant l'arrêt sur image (0.05 = 20 fois plus lent).
vitesse_arret=0.05
