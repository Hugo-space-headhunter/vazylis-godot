; Panoplies (docs/game-design.md, « Panoplies et bonus » et « Exemple : les panoplies de la zone 1 »).
;
; Porter plusieurs pièces d'une même panoplie débloque ses paliers de bonus ; la panoplie
; complète ajoute un effet spécial. On peut cumuler les premiers paliers de plusieurs panoplies.
;
; Chaque panoplie a sa section :
;   nom       : nom affiché
;   sous_boss : le sous-boss qui lâche ses pièces (section de monstres.cfg)
;   teinte    : couleur des pièces sur le personnage (multiplie leurs couleurs)
;   paliers   : liste de paliers {"pieces": nombre de pièces portées,
;                 "statistiques": {…}, "bonus": {… en %, 0.05 = 5 %}, "effet": effet spécial}
; Les pièces sont les familles d'objets de objets.cfg dont « panoplie » vaut l'identifiant.
;
; Bonus en % possibles : vitesse_attaque, chance_critique, degats_critiques, vie, degats, defense.

[effets]

; Regain : part de la vie maximum rendue chaque seconde, après ce délai sans être frappé.
regain_par_seconde=0.01
regain_delai_hors_combat=4.0
; Épines : part des dégâts reçus renvoyée à l'attaquant.
epines=0.1
; Bastion : chance de bloquer entièrement un coup.
bastion=0.15
; Rage : dégâts en plus quand la vie est sous ce seuil.
rage_seuil=0.5
rage_degats=0.2

[effet.regain]

nom="Regain"
description="Régénère 1 % de vie par seconde hors combat"

[effet.epines]

nom="Épines"
description="Renvoie 10 % des dégâts reçus"

[effet.bastion]

nom="Bastion"
description="15 % de chance de bloquer entièrement un coup"

[effet.rage]

nom="Rage"
description="+20 % de dégâts sous 50 % de vie"

[panoplie.couronne_verger]

nom="Couronne du Verger"
sous_boss="monstre.pomelin_royal"
teinte=Color(0.78, 0.92, 0.55, 1)
paliers=[{"pieces": 2, "statistiques": {"vitalite": 15}}, {"pieces": 3, "bonus": {"vie": 0.05}, "effet": "regain"}]

