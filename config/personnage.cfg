; Déplacement du personnage. Les vitesses sont en mètres par seconde.

[deplacement]

; Vitesse quand le joystick est poussé à moitié.
vitesse_marche=1.8
; Vitesse quand le joystick est poussé à fond.
vitesse_course=4.5
; Vitesse à laquelle le personnage atteint sa vitesse ou s'arrête
; (plus grand = plus nerveux, plus petit = plus glissant).
acceleration=18.0
; Vitesse à laquelle le personnage se tourne vers sa direction (plus grand = plus vif).
lissage_rotation=12.0

[animation]

; Vitesse de déplacement pour laquelle les animations de marche et de course
; sont jouées à vitesse normale. Si les pieds « glissent » sur le sol,
; ajuster ces valeurs jusqu'à ce que les pas collent au déplacement.
vitesse_reference_marche=1.8
vitesse_reference_course=4.5
; Durée du fondu entre deux animations, en secondes.
fondu=0.2
