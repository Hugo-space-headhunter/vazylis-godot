; Ressources (docs/game-design.md, « Les 4 familles de matériaux »).
; Elles sont rangées à part, sans prendre de case dans le sac, et serviront à la forge (étape 7).
;
; Chaque ressource a sa section :
;   nom     : nom affiché
;   famille : "minerai", "bois", "peau", "pierre_precieuse" ou "familier"
;   zone    : zone dont c'est le palier (1 = la Vallée claire)
;   couleur : couleur de son petit rond dans le sac

[ressource.fer]

nom="Fer"
famille="minerai"
zone=1
couleur=Color(0.62, 0.62, 0.66, 1)

[ressource.chene]

nom="Chêne"
famille="bois"
zone=1
couleur=Color(0.6, 0.42, 0.24, 1)

[ressource.cuir]

nom="Cuir"
famille="peau"
zone=1
couleur=Color(0.55, 0.35, 0.22, 1)

[ressource.lueur_familier]

; Lâchée par les sous-boss ; elle fera évoluer le familier (étape 8).
nom="Lueur de familier"
famille="familier"
zone=0
couleur=Color(0.55, 0.9, 1, 1)
