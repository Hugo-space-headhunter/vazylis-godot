; Types d'armes (docs/game-design.md, section « Affinités entre statistiques et armes »).
;
; Chaque type d'arme a sa section :
;   nom                     : nom affiché
;   vitesse                 : coups par seconde
;   multiplicateur_degats   : multiplie les dégâts de l'arme (faibles < 1 < très élevés)
;   affinite                : statistique fétiche ("force", "agilite", "vitalite" ou "intelligence")
;   portee                  : distance d'attaque, en mètres
;   a_distance              : vrai pour l'arc (tire une flèche)
;   bonus_critique          : chance de critique en plus (0.1 = +10 %)
;   multiplicateur_critique : dégâts des coups critiques
;   ignore_defense          : part de la défense adverse ignorée (0.15 = 15 %)
;   chance_blocage          : chance d'annuler entièrement un coup reçu (0.1 = 10 %)
;   defense_par_niveau      : défense apportée (bouclier), par niveau du joueur
;   modele_main_droite / modele_main_gauche : identifiants des modèles (assets/catalogue.cfg)
;   animation               : animation standard de l'attaque
;   moment_du_coup          : moment de l'animation où le coup touche (0 = début, 1 = fin)

[arme.dagues]

nom="Paire de dagues"
vitesse=1.6
multiplicateur_degats=0.65
affinite="agilite"
portee=1.5
a_distance=false
bonus_critique=0.1
multiplicateur_critique=1.5
ignore_defense=0.0
chance_blocage=0.0
defense_par_niveau=0.0
modele_main_droite="weapon.dague"
modele_main_gauche="weapon.dague"
animation="attack"
moment_du_coup=0.4

