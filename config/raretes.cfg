; Raretés des items (docs/game-design.md, section « Raretés »).
;
; Chaque rareté a sa propre section :
;   nom            : nom affiché dans le jeu
;   multiplicateur : multiplie la puissance de l'item (puissance = niveau × multiplicateur)
;   bonus_pourcent : nombre de bonus en % portés par l'item (proposition, à valider)
;   couleur        : couleur de la rareté (nom de l'objet, cadre, éclat du butin)
;
; Pour ajuster l'équilibrage, change simplement les nombres puis relance le jeu.

[raretes]

; Ordre des raretés, de la plus commune à la plus rare.
ordre=["standard", "argente", "dore", "epique", "mythique", "transcendant"]

[standard]

nom="Standard"
multiplicateur=1.0
bonus_pourcent=0
couleur=Color(0.72, 0.67, 0.6, 1)

[argente]

nom="Argenté"
multiplicateur=1.2
bonus_pourcent=1
couleur=Color(0.82, 0.88, 0.97, 1)

[dore]

nom="Doré"
multiplicateur=1.45
bonus_pourcent=2
couleur=Color(1, 0.8, 0.25, 1)

[epique]

nom="Épique"
multiplicateur=1.75
bonus_pourcent=3
couleur=Color(0.3, 0.55, 1, 1)

[mythique]

nom="Mythique"
multiplicateur=2.1
bonus_pourcent=4
couleur=Color(0.9, 0.18, 0.22, 1)

[transcendant]

nom="Transcendant"
multiplicateur=2.5
bonus_pourcent=5
couleur=Color(1, 0.98, 0.88, 1)
