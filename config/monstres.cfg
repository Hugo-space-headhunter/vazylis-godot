; Monstres (docs/game-design.md, section « Bestiaire »).
;
; Chaque monstre a sa section, nommée par son identifiant :
;   nom             : nom affiché
;   modele          : identifiant du modèle dans assets/catalogue.cfg
;   niveau_min/max  : niveaux possibles (tirés au hasard à chaque apparition)
;   comportement    : "passif" (n'attaque que si on le frappe) ou "agressif" (charge le joueur)
;   vitesse_marche  : vitesse quand il se promène (m/s)
;   vitesse_course  : vitesse quand il poursuit le joueur (m/s)
;   rayon_errance   : distance max de promenade autour de son point d'apparition (m)
;   rayon_detection : distance à laquelle un agressif repère le joueur (m)
;   rayon_laisse    : au-delà de cette distance de son point d'apparition, il abandonne et rentre (m)
;   portee_attaque  : distance à laquelle il mord (m)
;   intervalle_attaque : secondes entre deux attaques
;   reapparition    : secondes avant de réapparaître après sa mort

[monstre.cochonnet_suie]

nom="Cochonnet de suie"
modele="monster.cochonnet_suie"
niveau_min=1
niveau_max=3
comportement="passif"
vitesse_marche=0.8
vitesse_course=2.2
rayon_errance=4.0
rayon_detection=0.0
rayon_laisse=12.0
portee_attaque=1.1
intervalle_attaque=1.6
reapparition=8.0

