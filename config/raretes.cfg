; Raretés des items (docs/game-design.md, section « Raretés »).
;
; Chaque rareté a sa propre section :
;   nom            : nom affiché dans le jeu
;   multiplicateur : multiplie la puissance de l'item (puissance = niveau × multiplicateur)
;   bonus_pourcent : nombre de bonus en % portés par l'item (proposition, à valider)
;
; Pour ajuster l'équilibrage, change simplement les nombres puis relance le jeu.

[raretes]

; Ordre des raretés, de la plus commune à la plus rare.
ordre=["standard", "argente", "dore", "epique", "mythique", "transcendant"]

[standard]

nom="Standard"
multiplicateur=1.0
bonus_pourcent=0

[argente]

nom="Argenté"
multiplicateur=1.2
bonus_pourcent=1

[dore]

nom="Doré"
multiplicateur=1.45
bonus_pourcent=2

[epique]

nom="Épique"
multiplicateur=1.75
bonus_pourcent=3

[mythique]

nom="Mythique"
multiplicateur=2.1
bonus_pourcent=4

[transcendant]

nom="Transcendant"
multiplicateur=2.5
bonus_pourcent=5
