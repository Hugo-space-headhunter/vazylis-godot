; Combat (docs/game-design.md, sections « Formules de combat » et « Calibrage des monstres »).

[joueur]

; Points de vie = base + par_niveau × niveau + points de Vitalité (voir statistiques.cfg).
pv_base=100.0
pv_par_niveau=15.0
; Après une mort : secondes avant de revenir au point de départ (provisoire, la vraie mort arrive à l'étape 6).
delai_reapparition=3.0
; Arme portée au départ (section de armes.cfg).
arme_depart="arme.epee_bouclier"

[arme]

; Dégâts de l'arme = (degats_base + degats_par_niveau × niveau de l'arme) × rareté × multiplicateur du type d'arme.
; En attendant le butin (étape 4), l'arme est standard et du niveau du joueur.
rarete="standard"
degats_base=10.0
degats_par_niveau=3.0

[critique]

; Chance de base de coup critique (0 à 1). Le multiplicateur de dégâts dépend de l'arme (armes.cfg).
chance=0.05

[calibrage]

; Temps visé pour tuer un monstre de son niveau, et pour qu'il tue le joueur sans soin (secondes).
secondes_pour_tuer_un_monstre=10.0
secondes_pour_etre_tue=60.0
; Le joueur « moyen » qui sert de référence : points mis dans chaque statistique à chaque niveau, et son arme.
points_par_statistique_par_niveau=1
arme_reference="arme.epee_bouclier"
; Les monstres passifs frappent moins fort (0.5 = deux fois moins).
multiplicateur_passifs=0.5
; Un monstre plus haut que le joueur de plus de « ecart_sans_bonus » niveaux
; frappe « bonus_par_niveau » plus fort par niveau d'écart au-delà.
ecart_sans_bonus=5
bonus_par_niveau=0.05
