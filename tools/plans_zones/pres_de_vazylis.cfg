; Plan des Prés de Vazylis (tools/peupler_zone.gd) : bosquets en bordure, massifs de fleurs et buissons
; ajoutés au décor posé à la main (gardé tel quel). Repère de la zone : (0, 0) = centre, la zone va de
; -50 à +50 en x et en z ; Vazylis est en (0, 25), le Bois des Lucioles au-delà de z = -50.
; Les monstres de la zone sont posés à la main : ce plan n'en ajoute pas.

[zone]

graine=7
; Vazylis et ses remparts, et la clairière du Pomelin Royal.
places_libres=[[0, 25, 24]]
; Le chemin de terre, qui serpente autour de x = 0.
chemin={"x": 0.0, "demi_largeur": 7.0}

; Bosquets le long des bords : ils ferment l'horizon et donnent de la profondeur, sans gêner le combat.
[decor.Bosquet]

assets=["prop.erable_1", "prop.erable_2", "prop.erable_3", "prop.bouleau_1", "prop.bouleau_2", "prop.bouleau_3"]
nombre=22
pres_du_bord=12.0
marge_bord=2.0
ecart_min=4.5
echelle=[0.85, 1.25]
obstacle=Vector3(0.7, 3, 0.7)
distance_affichage=45.0
fondu_camera=4.0

; Buissons, surtout au pied des bosquets.
[decor.Buisson]

assets=["prop.buisson", "prop.buisson_fleuri", "prop.buisson_grand"]
nombre=12
pres_du_bord=16.0
ecart_min=3.0
echelle=[0.8, 1.2]
distance_affichage=35.0

; Massifs de fleurs dans toute la prairie.
[decor.Fleurs]

assets=["prop.fleurs_1", "prop.fleurs_2", "prop.fleurs_3", "prop.buisson_fleuri_bas"]
nombre=26
ecart_min=3.0
echelle=[0.8, 1.3]
distance_affichage=28.0
projette_ombre=false
